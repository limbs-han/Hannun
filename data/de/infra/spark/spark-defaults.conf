# Spark 클라이언트 기본 설정 (S15P21E105-105).
#
# dfs.replication: Spark 가 HDFS 에 파일을 쓸 때 자기 기본값 3 을 요청한다. 서버 기본값은
# 1 인데 클라이언트가 보낸 값이 이긴다. 그래서 파일에는 "3 개 있어야 한다"고 적히고 실제로는
# 1 개만 생겨, 단일 노드라 영영 못 채우는 블록이 쌓인다. 데이터는 멀쩡하지만 점검(fsck)이
# 항상 부족으로 나와 진짜 문제가 묻힌다. 실측 2026-09-11 에 4,368 블록 중 3,842 개(88%).
#
# 잡마다 설정하는 대신 여기 한 줄로 둔다. compose 가 SPARK_CONF_DIR 로 이 폴더를 가리킨다.
spark.hadoop.dfs.replication 1
