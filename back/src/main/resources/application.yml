server:
  tomcat:
    uri-encoding: UTF-8   # 없으면 쿼리 파라미터에 한글 등 비ASCII 오면 Tomcat이 디코딩 실패시킴(400)

spring:
  application:
    name: news-write-service

  datasource:
    url: jdbc:mysql://localhost:3306/news?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
    username: news
    password: news1234

  jpa:
    hibernate:
      ddl-auto: update   # 로컬 개발용 임시 설정
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50   # dirty checking으로 발생하는 UPDATE/INSERT를 50개씩 묶어서 전송

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: manual_immediate

news:
  kafka:
    topic:
      article-ingest: news.article.raw          # 크롤러 -> 우리: 원본 기사 저장 요청
      clustering-completed: news.clustering.completed  # DE -> 우리: 클러스터링 완료, clusterId 벌크 반영

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
