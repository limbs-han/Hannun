global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 블루그린이라 4개 인스턴스를 다 나열 - 비활성 색상은 그냥 down으로 보이는 게 정상(무해함)
  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'app-blue-1:8080'
          - 'app-blue-2:8080'
          - 'app-green-1:8080'
          - 'app-green-2:8080'

  - job_name: 'mysqld-exporter'
    static_configs:
      - targets: ['mysqld-exporter:9104']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
