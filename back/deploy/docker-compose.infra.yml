name: news-platform

services:
  mysql:
    image: mysql:8.0
    container_name: news-mysql
    restart: unless-stopped
    mem_limit: 2048m
    # innodb_buffer_pool_size 기본값(128MB)이 너무 작음 - 컨테이너 한도(2GB)의 절반을 버퍼풀에 주고,
    # 나머지는 커넥션별 버퍼/OS 오버헤드용으로 남겨둠.
    command: --innodb-buffer-pool-size=1G
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: news
      MYSQL_USER: news
      MYSQL_PASSWORD: news1234
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - news-net

  redis:
    image: redis:7-alpine
    container_name: news-redis
    restart: unless-stopped
    mem_limit: 384m
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - news-net

  # Kafka KRaft 3노드 클러스터(각자 broker+controller 겸용) — Zookeeper 없음
  # replication.factor=3, min.insync.replicas=2로 브로커 1대가 죽어도 커밋된 데이터는 안 잃게 구성.
  # 컨트롤러 쿼럼도 3개 다 투표권을 가짐(과반 2/3면 리더 선출 가능).
  kafka1:
    image: apache/kafka:4.2.1
    container_name: news-kafka-1
    restart: unless-stopped
    mem_limit: 2048m
    ports:
      - "9092:9092"       # 외부(크롤러/DE)에서 접속할 부트스트랩 주소 중 하나
    environment: &kafka-common-env
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:19092,PLAINTEXT_HOST://j15e105.p.ssafy.io:9092
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT: 컨테이너 네트워크 내부 통신(app, kafka-ui, exporter), PLAINTEXT_HOST: 외부에서 접속
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:19093,2@kafka2:19093,3@kafka3:19093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck: &kafka-healthcheck
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - kafka1_data:/var/lib/kafka/data
    networks:
      - news-net

  kafka2:
    image: apache/kafka:4.2.1
    container_name: news-kafka-2
    restart: unless-stopped
    mem_limit: 2048m
    ports:
      - "9093:9092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:19092,PLAINTEXT_HOST://j15e105.p.ssafy.io:9093
    healthcheck: *kafka-healthcheck
    volumes:
      - kafka2_data:/var/lib/kafka/data
    networks:
      - news-net

  kafka3:
    image: apache/kafka:4.2.1
    container_name: news-kafka-3
    restart: unless-stopped
    mem_limit: 2048m
    ports:
      - "9094:9092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:19092,PLAINTEXT_HOST://j15e105.p.ssafy.io:9094
    healthcheck: *kafka-healthcheck
    volumes:
      - kafka3_data:/var/lib/kafka/data
    networks:
      - news-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: news-kafka-ui
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:19092,kafka2:19092,kafka3:19092
    networks:
      - news-net

  prometheus:
    image: prom/prometheus:latest
    container_name: news-prometheus
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - news-net

  grafana:
    image: grafana/grafana:latest
    container_name: news-grafana
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - news-net

  # --- exporters: 각 저장소/브로커의 지표를 Prometheus가 읽을 수 있는 형태로 변환해서 노출 ---
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: news-mysqld-exporter
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - mysql
    ports:
      - "9104:9104"
    volumes:
      - ../docker/mysql/exporter/.my.cnf:/.my.cnf:ro
    command:
      - "--collect.perf_schema.eventsstatements"
      - "--collect.perf_schema.eventsstatements.digest_text_limit=200"
      - "--collect.perf_schema.eventsstatements.limit=50"
    networks:
      - news-net

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: news-redis-exporter
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - redis
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - news-net

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: news-kafka-exporter
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    ports:
      - "9308:9308"
    command: ["--kafka.server=kafka1:19092", "--kafka.server=kafka2:19092", "--kafka.server=kafka3:19092"]
    networks:
      - news-net

  # 컨테이너별 CPU/메모리를 Prometheus로 노출 - 카프카 브로커가 메모리 한도(1GB) 근처까지 갔던 걸
  # docker stats로 수동 확인해야 했던 문제(8000/s 스트레스 테스트 때) 해결용. 다른 컨테이너 안 건드리고
  # 읽기 전용으로 지켜만 봄.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: news-cadvisor
    restart: unless-stopped
    mem_limit: 128m
    privileged: true
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - news-net

networks:
  news-net:
    driver: bridge
    name: news-platform-net

volumes:
  mysql_data:
  redis_data:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  prometheus_data:
  grafana_data:
