server {
    server_name j15e105.p.ssafy.io;

    # 프론트(Vue SPA) 정적 파일. history mode 라우팅이라 없는 경로는 index.html로 폴백.
    location / {
        root /var/www/news-front;
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API. 프론트가 VITE_API_BASE_URL을 비워두고 같은 오리진의 /api를 상대경로로 호출하는 구조.
    location /api/ {
        proxy_pass http://news_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/j15e105.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15e105.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = j15e105.p.ssafy.io) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name j15e105.p.ssafy.io;
    return 404;
}
