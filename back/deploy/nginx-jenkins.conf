map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 9443 ssl;
    server_name j15e105.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/j15e105.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15e105.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:8089;
        # $host는 포트를 뺀 호스트명만 남겨서 Jenkins가 설정된 자기 URL(:9443 포함)이랑 다르다고 거부함 -> $http_host로 원본 그대로 전달
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # 젠킨스 CLI/빌드 로그 스트리밍이 WebSocket을 씀 -> 업그레이드 헤더 제대로 전달
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
