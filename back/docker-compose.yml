name: news-platform

services:
  mysql:
    image: mysql:8.0
    container_name: news-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: news
      MYSQL_USER: news
      MYSQL_PASSWORD: news1234
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - news-net

  redis:
    image: redis:7-alpine
    container_name: news-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - news-net

  # Kafka KRaft 단일 노드(broker+controller 겸용) — Zookeeper 없음
  kafka:
    image: apache/kafka:4.2.1
    container_name: news-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"       # 앱(호스트)에서 접속: localhost:9092
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT: 컨테이너 네트워크 내부 통신(kafka-ui 등), PLAINTEXT_HOST: 호스트에서 접속
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:19093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - news-net

  # 로컬 개발용 Kafka 토픽/메시지 확인 UI (선택, 편의상 포함)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: news-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    networks:
      - news-net

  prometheus:
    image: prom/prometheus:latest
    container_name: news-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 호스트에서 뜨는 Spring Boot 앱 스크레이핑용
    networks:
      - news-net

  grafana:
    image: grafana/grafana:latest
    container_name: news-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - news-net

  # --- exporters: 각 저장소/브로커의 지표를 Prometheus가 읽을 수 있는 형태로 변환해서 노출 ---
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: news-mysqld-exporter
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "9104:9104"
    volumes:
      - ./docker/mysql/exporter/.my.cnf:/.my.cnf:ro
    # 슬로우쿼리 진단용: performance_schema의 쿼리 digest별(=같은 패턴 쿼리끼리 묶음) 통계 수집
    command:
      - "--collect.perf_schema.eventsstatements"
      - "--collect.perf_schema.eventsstatements.digest_text_limit=200"
      - "--collect.perf_schema.eventsstatements.limit=50"
    networks:
      - news-net

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: news-redis-exporter
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - news-net

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: news-kafka-exporter
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "9308:9308"
    command: ["--kafka.server=kafka:19092"]
    networks:
      - news-net

networks:
  news-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
